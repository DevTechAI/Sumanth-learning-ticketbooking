spring.application.name=Oauth
spring.config.import=optional:file:.env[.properties]

server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/oauth_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Auth0 issuer. Do not use the token endpoint or JWKS URL here; Spring discovers metadata from this issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://dev-8v7uc0ix5izzkn00.us.auth0.com/}

auth0.client-id=${AUTH0_CLIENT_ID:}
auth0.admin-client-id=${AUTH0_ADMIN_CLIENT_ID:${AUTH0_CLIENT_ID:}}
auth0.client-secret=${AUTH0_CLIENT_SECRET:}
auth0.token-uri=${AUTH0_TOKEN_URI:https://dev-8v7uc0ix5izzkn00.us.auth0.com/oauth/token}
auth0.audience=${AUTH0_AUDIENCE:https://employee-api}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO
