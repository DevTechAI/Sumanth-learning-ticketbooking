spring.application.name=Oauth

server.port=8080

spring.datasource.url=jdbc:h2:mem:oauthdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Replace this with your OAuth provider's JWK endpoint.
# Keycloak example: http://localhost:8081/realms/oauth-demo/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OAUTH_JWK_SET_URI:http://localhost:8081/realms/oauth-demo/protocol/openid-connect/certs}
